# params.yaml
data_ingestion:
  raw_data_path: "data/raw/data.csv"
  bucket_name: "dataset-storage-versoining-enabled"
  object_key: "data.csv"
  version_id: "H_02Ey29YdEo0mHevb2117Y.VKBx2abc"
  
data_preprocessing:  
  train_file_path: "data/processed/train.csv"
  test_file_path: "data/processed/test.csv"
  
feature_engineering:
  best_parameters_file_path: "src/configs/best_params.yaml"
  test_size: 0.20
  random_state: 42
  max_features: 50
  vectorized_x_train_file_path: "data/vectorized/x_train.npz"
  vectorized_y_train_file_path: "data/vectorized/y_train.csv"
  vectorized_x_test_file_path: "data/vectorized/x_test.npz"
  vectorized_y_test_file_path: "data/vectorized/y_test.csv"
  preprocessed_model_file_path: "models/processing.pkl"

model_training:
  model_file_path: "models/model.pkl"

model_evaluation:
  model_eval_metrics_path: "src/configs/model_metrics.yaml"
  model_info_path: "src/configs/model_info.json"
  validation_report_path: "src/configs/validation_report.json"
  validation_thresholds:
    accuracy: 0.90
    f1_score: 0.90
    precision: 0.88
    recall: 0.88
    auc_score: 0.95

model_registry:
  model_name: "SGDxTFIDF_MODEL"
  staging_alias: "staging"
  production_alias: "production"
  pre_production: "previous_production"

mlflow:
  tracking_uri: "https://dagshub.com/riteshray007/review_sentiment_analysis_endToEnd_mlops.mlflow"
  dagshub:
    repo_owner: "riteshray007"
    repo_name: "review_sentiment_analysis_endToEnd_mlops"
    mlflow: True

    
randomized_cv_search:
  n_iter: 30
  random_state: 42
  n_jobs: -1
  verbose: 2
  error_score: "raise"
  return_train_score: True
  refit: "f1_macro"
