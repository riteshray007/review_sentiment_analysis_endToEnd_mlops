server:
  persistentVolume:
    enabled: false

alertmanager:
  enabled: false

pushgateway:
  enabled: false

nodeExporter:
  enabled: false

kubeStateMetrics:
  enabled: false

extraScrapeConfigs: |
  - job_name: 'flask-sentiment-app'
    metrics_path: '/metrics'
    scrape_interval: 5s
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - flask-app
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: flask-app-service