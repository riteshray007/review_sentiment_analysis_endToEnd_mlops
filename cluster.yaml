apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: mlops-sentiment-cluster
  region: us-east-1
  version: "1.35"  # Updated to modern standard support (zero extra AWS fees)

managedNodeGroups:
  - name: mlops-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 4     # Headroom safety buffer
    volumeSize: 30
    volumeType: gp3
    spot: false