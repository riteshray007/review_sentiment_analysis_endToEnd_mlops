name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'notebooks/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: RUN DVC PIPELINE, ALL TESTS & MODEL PROMOTION
  # Installs Python packages only ONCE for all tests
  # ─────────────────────────────────────────────────────────────
  test_and_promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run DVC Pipeline
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}          
        run: |
          dvc repro

      - name: Run Model Unit Tests (Staging)
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python -m unittest tests/test_model.py

      - name: Promote Model to Production
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python scripts/promote_model.py

      - name: Run Flask App Tests (Production)
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python -m unittest tests/test_flask_app.py

  # ─────────────────────────────────────────────────────────────
  # JOB 2: BUILD AND PUSH DOCKER IMAGE TO AWS ECR
  # Independent job - can be rerun alone if network/ECR fails
  # ─────────────────────────────────────────────────────────────
  build_and_push_ecr:
    needs: [test_and_promote]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2      

      - name: Build, Tag, and Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # ─────────────────────────────────────────────────────────────
  # JOB 3: DEPLOY & ROLLOUT RESTART ON AWS EKS
  # Runs only after the Docker image is successfully pushed to ECR
  # ─────────────────────────────────────────────────────────────
  deploy_to_eks:
    needs: [build_and_push_ecr]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name mlops-sentiment-cluster

      - name: Ensure Namespace Exists & Update Secrets
        run: |
          kubectl create namespace flask-app --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic app-secrets \
            --namespace flask-app \
            --from-literal=DAGSHUB_USERNAME="${{ secrets.DAGSHUB_USERNAME }}" \
            --from-literal=DAGSHUB_TOKEN="${{ secrets.DAGSHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes Deployment Manifest
        run: |
          kubectl apply -f k8s/flask-deployment.yaml

      - name: Trigger Zero-Downtime Rolling Restart
        run: |
          kubectl rollout restart deployment flask-app -n flask-app

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/flask-app -n flask-app --timeout=180s