name: CI pipeline

# Defines what events trigger this workflow
on:
  push:
    # Runs the workflow only when changes are pushed to the main branch
    branches:
      - main
    # Skips execution if ONLY these files or directories are modified
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'notebooks/**'
  # Allows manual triggering of the workflow from the GitHub UI
  workflow_dispatch:

# ─── CONCURRENCY CONTROL ─────────────────────────────
concurrency:
  # Groups runs by workflow name and branch/tag to manage simultaneous executions
  group: ${{ github.workflow }}-${{ github.ref }}
  # Automatically stops older, active runs if a new commit is pushed to the same branch
  cancel-in-progress: true
# ─────────────────────────────────────────────────────

# Defines the execution logic and steps for the pipeline
jobs:
  project_testing:
    # Runs the job inside a fresh Ubuntu Linux virtual environment
    runs-on: ubuntu-latest

    steps:
      # Clones the repository files into the runner environment
      - name: checkout code
        uses: actions/checkout@v4

      # Configures the Python runtime environment and caches pip packages for speed
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      # Upgrades baseline packaging tools and installs project dependencies
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      # Executes the data/ML pipeline stages using Data Version Control (DVC)
      - name: run pipeline
        # Injects required external credentials into the runner as environment variables
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}          
        run: |
          dvc repro

      - name: Run model test
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python -m unittest tests/test_model.py
      